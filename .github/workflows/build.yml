name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag versi rilis'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: ./.github/actions/setup-android

      - name: Tentukan versi
        id: ver
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE 'alpha|beta|rc'; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Verifikasi tanda tangan dan rename
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="Resteam-${{ steps.ver.outputs.tag }}.apk"
          cp "$SRC" "$OUT"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --verbose "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Catatan rilis dari CHANGELOG
        run: |
          awk -v t="${{ steps.ver.outputs.tag }}" '/^## /{f=(index($0,t)>0)} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp CHANGELOG.md notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Resteam ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.ver.outputs.pre }}
          files: ${{ steps.apk.outputs.file }}

      - name: Hapus keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"