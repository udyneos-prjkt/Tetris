name: Setup Android toolchain
description: JDK 17, Android SDK + NDK + CMake, dan Gradle 8.7 (dengan cache)
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
