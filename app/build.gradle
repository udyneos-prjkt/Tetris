plugins {
    id "com.android.application"
}
def vName = project.hasProperty("versionName") ? project.property("versionName") : "1.1"
def vCode = project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 5

android {
    namespace "com.udyneos.neontetris"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.udyneos.neontetris"
        minSdk 23            // Android 6.0
        targetSdk 34
        versionCode 1
        versionName "1.1"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    signingConfigs {
        release {
            def path = System.getenv("KEYSTORE_PATH")
            if (path != null && !path.trim().isEmpty() && file(path).exists()) {
                storeFile file(path)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false // Set true jika ingin ukuran rilis lebih kecil
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Logika fallback: jika ada KEYSTORE_PATH di CI, pakai release. Jika lokal, pakai debug.
            def path = System.getenv("KEYSTORE_PATH")
            if (path != null && !path.trim().isEmpty()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Plugin google-services hanya aktif bila google-services.json ada,
// sehingga build offline tanpa Firebase tetap berjalan.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-functions"
    implementation "androidx.credentials:credentials:1.2.2"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"
}
